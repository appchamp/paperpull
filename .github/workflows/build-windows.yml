# Builds the Windows package on a clean runner, so a release never depends on
# something that only exists on one machine, and signs it with Azure Artifact
# Signing when the repository is set up for it.
#
# Signing happens in two places. PaperPull.exe and the bundled Python's own
# programs and libraries are signed in the staged folder, before it is
# zipped, packed into the MSIX and wrapped by the installer, so every copy
# of them that ships carries the signature. Then the installer itself is
# signed. The MSIX is left for the Store, which signs it on submission.
#
# Signing runs only when the repository variable ARTIFACT_SIGNING_ENDPOINT is
# set. Without it the job builds the same package unsigned, as a local build
# does. When it is set, a file that comes out unsigned stops the job, so an
# unsigned build can never pass for a signed one. The Azure sign-in is by
# OpenID Connect through the "release" environment, with no password stored
# anywhere. See docs/code-signing.md for the one-time setup.
#
# Nothing here publishes. The artifacts sit on the workflow run and
# tools/release.sh attaches them to a release, so a tag push cannot ship
# anything on its own.

name: Windows package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # The environment is what the Azure federated credential trusts. Its
    # secrets and variables hold the signing details.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      SIGNING: ${{ vars.ARTIFACT_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Stage the package
        run: python packaging/build_windows.py --stage-only

      - name: Sign in to Azure
        if: env.SIGNING == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The app holds a role on the signing account only, not on the
          # subscription, so the sign-in names no subscription and the Azure
          # CLI is told not to look for one. Signing needs none.
          allow-no-subscriptions: true

      # PaperPull.exe, the one program the build compiles, and the bundled
      # Python's own programs and libraries, which python-build-standalone
      # ships unsigned. Their archive was checked against its pinned SHA-256
      # before anything was built from it, and the build recorded each of
      # these files' SHA-256 as the archive held it in
      # dist\python-files.sha256. The packages were installed into the same
      # folder since, so a file that no longer matches its record stops the
      # job here, before anything is signed. Everything else under
      # dist\PaperPull keeps whatever signature its publisher gave it. The
      # two Visual C++ runtime DLLs keep Microsoft's, and the packages from
      # the hashed lock and their Scripts launchers keep theirs or none.
      # Each listed file is moved aside under the same relative path, so
      # nothing else can be signed by mistake, signed in one call and put
      # back. That is 30 signatures a build, 31 with the installer, against
      # the 5,000 a month of the Basic plan. A new python-build-standalone
      # release can add a file, so putting them back also checks that no
      # program or library is left unsigned in python\ or python\DLLs, and
      # core/tests holds the list.
      - name: Set PaperPull.exe and the interpreter aside for signing
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sign = @(
            'PaperPull.exe'
            'python\python.exe'
            'python\pythonw.exe'
            'python\python3.dll'
            'python\python312.dll'
            'python\DLLs\libcrypto-3-x64.dll'
            'python\DLLs\libffi-8.dll'
            'python\DLLs\libssl-3-x64.dll'
            'python\DLLs\sqlite3.dll'
            'python\DLLs\_asyncio.pyd'
            'python\DLLs\_bz2.pyd'
            'python\DLLs\_ctypes.pyd'
            'python\DLLs\_decimal.pyd'
            'python\DLLs\_elementtree.pyd'
            'python\DLLs\_hashlib.pyd'
            'python\DLLs\_lzma.pyd'
            'python\DLLs\_msi.pyd'
            'python\DLLs\_multiprocessing.pyd'
            'python\DLLs\_overlapped.pyd'
            'python\DLLs\_queue.pyd'
            'python\DLLs\_socket.pyd'
            'python\DLLs\_sqlite3.pyd'
            'python\DLLs\_ssl.pyd'
            'python\DLLs\_uuid.pyd'
            'python\DLLs\_wmi.pyd'
            'python\DLLs\_zoneinfo.pyd'
            'python\DLLs\pyexpat.pyd'
            'python\DLLs\select.pyd'
            'python\DLLs\unicodedata.pyd'
            'python\DLLs\winsound.pyd'
          )
          $came = @{}
          foreach ($line in Get-Content dist\python-files.sha256) {
            $hash, $rel = $line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path dist\PaperPull $rel)).Hash -ne $hash) {
              throw "$rel is no longer the file the checked archive held"
            }
            $came[$rel] = $hash
          }
          foreach ($rel in $sign) {
            if ($rel -ne 'PaperPull.exe' -and -not $came.ContainsKey($rel)) { throw "$rel did not come from the checked archive" }
            $to = Join-Path to-sign\stage $rel
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Move-Item -LiteralPath (Join-Path dist\PaperPull $rel) -Destination $to
          }
          $sign | Set-Content -Encoding ascii to-sign\signed.txt
          Write-Output ("{0} files set aside for signing" -f $sign.Count)

      - name: Sign PaperPull.exe and the interpreter
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\to-sign\stage
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Put the signed files back
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-Content to-sign\signed.txt)
          $signer = $null
          foreach ($rel in $signed) {
            $at = Join-Path dist\PaperPull $rel
            Move-Item -LiteralPath (Join-Path to-sign\stage $rel) -Destination $at
            $sig = Get-AuthenticodeSignature -LiteralPath $at
            if ($sig.Status -ne 'Valid') { throw "$rel is not validly signed: $($sig.Status)" }
            if (-not $signer) { $signer = $sig.SignerCertificate.Subject }
            if ($sig.SignerCertificate.Subject -ne $signer) { throw "$rel is signed by $($sig.SignerCertificate.Subject), not $signer" }
          }
          $unsigned = @(Get-ChildItem dist\PaperPull\python, dist\PaperPull\python\DLLs -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.pyd' } |
            Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' })
          if ($unsigned) { throw "not signed and not on the list to sign: $($unsigned.Name -join ', ')" }
          Write-Output ("{0} files signed by {1}, PaperPull.exe and the interpreter" -f $signed.Count, $signer)

      - name: Build the zip, installer and MSIX from the stage
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: python packaging/build_windows.py --package-only --installer --msix

      - name: Refuse to continue without an installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "PaperPull-*-setup.exe"
          if (-not $exe) { throw "Inno Setup produced no installer" }
          Write-Output $exe.Name
          New-Item -ItemType Directory -Force to-sign\installer | Out-Null
          Copy-Item $exe.FullName to-sign\installer\

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\to-sign\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check every shipped program is signed
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem to-sign\installer -Filter "PaperPull-*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName dist\ -Force
          $zip = Get-ChildItem dist -Filter "PaperPull-*.zip" | Select-Object -First 1
          $unzipped = Join-Path $env:RUNNER_TEMP "zipcheck"
          Expand-Archive $zip.FullName -DestinationPath $unzipped -Force
          $inZip = Get-ChildItem $unzipped -Recurse -Filter PaperPull.exe | Select-Object -First 1
          $zipRoot = Split-Path $inZip.FullName
          $check = @(Join-Path dist $exe.Name) + @(Get-Content to-sign\signed.txt | ForEach-Object { Join-Path $zipRoot $_ })
          foreach ($f in $check) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status)" }
            Write-Output ("{0} signed by {1}" -f $f.Replace($zipRoot, "zip"), $sig.SignerCertificate.Subject)
          }

      # The Store signs the real package. To prove this one installs, it is
      # signed here with a certificate made for the job and thrown away, then
      # sideloaded, listed, run for a moment and removed. Add-AppxPackage is
      # the strictest manifest check there is short of the Store's own.
      - name: Prove the MSIX installs and runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem dist -Filter "PaperPull-*.msix" | Select-Object -First 1
          if (-not $msix) { throw "no .msix was built" }
          $publisher = ([xml](Get-Content dist/msix/AppxManifest.xml)).Package.Identity.Publisher
          Write-Output "publisher in manifest: $publisher"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName "PaperPull CI sideload" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "sideload.pfx"
          $pw = ConvertTo-SecureString -String (-join ((48..57 + 65..90) | Get-Random -Count 24 | ForEach-Object {[char]$_})) -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation "Cert:\LocalMachine\Root" -Password $pw | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $signed = Join-Path $env:RUNNER_TEMP "sideload.msix"
          Copy-Item $msix.FullName $signed
          & $signtool.FullName sign /fd SHA256 /a /f $pfx /p ([System.Net.NetworkCredential]::new('', $pw).Password) $signed
          Add-AppxPackage -Path $signed
          $pkg = Get-AppxPackage | Where-Object { $_.Name -like "*PaperPull*" }
          if (-not $pkg) { throw "the package did not install" }
          Write-Output ("installed: " + $pkg.PackageFullName + " version " + $pkg.Version)
          Write-Output ("install location: " + $pkg.InstallLocation)
          $want = python -c "import sys; sys.path.insert(0, 'packaging'); import build_windows; print(build_windows.PY_VERSION)"
          $have = & (Join-Path $pkg.InstallLocation "python\python.exe") -c "import platform; print(platform.python_version())"
          if ($have -ne $want) { throw "the installed package runs Python $have, and the build names $want" }
          Write-Output "the installed package runs Python $have"
          $env:PAPERPULL_PORT = "8790"
          $proc = Start-Process -FilePath (Join-Path $pkg.InstallLocation "PaperPull.exe") -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Headers @{Origin='http://127.0.0.1:8790'} http://127.0.0.1:8790/api/providers -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) { throw "the panel did not answer from the installed package" }
          $n = ($r.Content | ConvertFrom-Json).providers.Count
          Write-Output "panel answered from the installed package with $n providers"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'python.exe' -and $_.CommandLine -like '*8790*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Remove-AppxPackage -Package $pkg.PackageFullName
          Remove-Item $pfx, $signed -Force
          Write-Output "removed again"

      # After signing, so the checksums are of the files that ship.
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -like "PaperPull-*.exe" -or $_.Name -like "PaperPull-*.zip" -or $_.Name -like "PaperPull-*.msix" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PaperPull-installer
          path: dist/PaperPull-*-setup.exe
          if-no-files-found: error

      - name: Upload the portable zip and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PaperPull-portable
          path: |
            dist/PaperPull-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # Unsigned as a package, as the Store wants it. The Store signs on
      # submission. The PaperPull.exe and the interpreter files inside it are
      # already signed.
      - name: Upload the MSIX for the Store
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PaperPull-msix-unsigned
          path: dist/PaperPull-*.msix
          if-no-files-found: error
