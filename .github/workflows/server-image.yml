# Builds the PaperPull Server image and starts it the way SERVER.md tells a
# person to, so an image is never first tried by the person who installs it.
#
# It runs on a push to main, on a pull request and on a version tag, like
# the tests. server/build.py builds the image from the files git tracks,
# and server/smoke.py starts it with compose.yaml, chooses a password with
# the setup code from the container's log, signs in, sets up a provider and
# runs the self-test inside the container, Chrome's sandbox included.
#
# It also runs on main each Monday, so the image's list of parts is
# checked against the newest known vulnerabilities even in a week with no
# change, and so a base digest the tag has moved on from is named.
#
# Nothing publishes on a push or a tag. The image goes to the GitHub
# Container Registry only when a release is published, which
# tools/release.sh does and a person runs, the same rule as the package
# workflows. That run builds and tests the image from the release's tag
# again, and the job that publishes takes that very image, never a build of
# its own, so what is pushed is what passed.
#
# GitHub's documentation says a new package starts private, but this one
# came out public on its first publish, 0.43.0, since the image's source
# label links it to this public repository. The publish job still warns
# if the image ever cannot be pulled without signing in.

name: Server image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  image:
    name: build and start the image
    runs-on: ubuntu-latest
    # A guard against a run that hangs. The build takes a few minutes and
    # the first start downloads Chrome.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: A release publishes the version it is named for
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "the release is $TAG, VERSION says $(cat VERSION)"
          test "v$(tr -d '[:space:]' < VERSION)" = "$TAG"

      - name: Build the image from the files git tracks
        run: python server/build.py

      - name: Start it the way SERVER.md says, and check it
        run: python server/smoke.py --image paperpull-server:dev

      # Every package in the image, Debian's, Python's and PaperPull's own,
      # listed in SPDX by Syft. Kept with every run, and a release signs it
      # and attaches it to the image it publishes.
      - name: List everything in the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: paperpull-server:dev
          format: spdx-json
          output-file: paperpull-server.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # A release signs the list with actions/attest, which refuses one
      # over 16 MB after the image is already pushed. Every run checks the
      # size first, so growth shows on a pull request, not on release day.
      - name: The list is small enough to sign
        run: |
          size="$(stat -c %s paperpull-server.spdx.json)"
          echo "the list of parts is $size bytes"
          test "$size" -lt 15000000

      # Grype reads that list for known vulnerabilities and prints each one
      # that has a fix. A critical one with a fix stops the run, so a
      # release never publishes it. A newer base digest (Dependabot's, or
      # python server/lock.py --base) or a raised pin in
      # server/requirements.in brings the fix in.
      - name: Check the list for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: paperpull-server.spdx.json
          output-format: table
          only-fixed: true
          severity-cutoff: critical
          fail-build: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paperpull-server-sbom
          path: paperpull-server.spdx.json
          retention-days: 90

      # Dependabot proposes the base tag's newer digest each week. This says
      # so on the weekly run too, should those proposals ever stop coming.
      - name: The base is the tag's newest digest
        if: github.event_name == 'schedule'
        run: |
          python server/lock.py --base --check || echo "::warning title=The server image's base is not the newest::server/Dockerfile names an older digest of its base tag, or the newest could not be read. Run python server/lock.py --base, or merge Dependabot's proposal."

      - name: Keep the tested image for the publish job
        if: github.event_name == 'release'
        run: docker save "paperpull-server:$(tr -d '[:space:]' < VERSION)" | gzip -1 > paperpull-server.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'release'
        with:
          name: paperpull-server-image
          path: paperpull-server.tar.gz
          # Already compressed, and only the publish job reads it.
          compression-level: 0
          retention-days: 7

  publish:
    name: publish the tested image
    needs: image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The one job that may write a package, and it runs only for a release
    # a person published. It may also sign, with a short-lived certificate
    # that GitHub's OIDC token gets from Sigstore, the image's list of
    # parts and the record of the run that built it.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paperpull-server-image

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paperpull-server-sbom

      - name: Push it to the GitHub Container Registry
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${OWNER,,}/paperpull-server"
          gunzip -c paperpull-server.tar.gz | docker load
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "paperpull-server:$version" "$image:$version"
          docker push "$image:$version"
          # The digest the registry gives the version, which the signed
          # list and record below name.
          digest="$(docker buildx imagetools inspect "$image:$version" --format '{{.Manifest.Digest}}')"
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The list of parts, signed and stored beside the image in the
      # registry and with GitHub, so anyone can check it with
      # gh attestation verify, see SECURITY-SERVER.md.
      - name: Sign the list of everything in the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: paperpull-server.spdx.json
          push-to-registry: true
          create-storage-record: false

      # Which workflow run, commit and tag the image came from.
      - name: Sign the record of how the image was built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # latest moves only once the version is pushed and signed. A
      # prerelease is for its testers, and latest stays on the last release
      # everyone gets.
      - name: Move latest to it
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          version="${TAG#v}"
          image="$IMAGE"
          if [ "$PRERELEASE" != "true" ]; then
            docker tag "paperpull-server:$version" "$image:latest"
            docker push "$image:latest"
          fi

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

      - name: Check that anyone can pull it
        run: |
          image="ghcr.io/${OWNER,,}/paperpull-server:${TAG#v}"
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "anyone can pull $image"
          else
            echo "::warning title=The server image is private::GitHub makes a new package private, so nobody can pull $image yet. Make it public once, in the package's settings under Danger Zone, https://github.com/users/${OWNER}/packages/container/paperpull-server/settings"
          fi
